version: "3.8"

services:
  mysqlDb:
    image: mysql:5.7
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=pokerit
    ports:
      - "3306:3306"
    volumes:
      - db:/var/lib/mysql
    networks:
      - monitoring-network

  app-kaddem:
    depends_on:
      - mysqlDb
    image: guerfala/pokerr:0.0.1  # Utilisez ici la version spécifique 0.0.1
    restart: on-failure
    ports:
      - "8082:8082"
    environment:
      SPRING_APPLICATION_JSON: '{
        "spring.datasource.url": "jdbc:mysql://mysqlDb:3306/pokerit?createDatabaseIfNotExist=true",
        "spring.datasource.username": "root",
        "spring.datasource.password": "rootpassword",
        "spring.jpa.properties.hibernate.dialect": "org.hibernate.dialect.MySQLDialect",
        "spring.jpa.hibernate.ddl-auto": "update"
      }'
    stdin_open: true
    tty: true
    networks:
      - monitoring-network

  prometheus:
    image: prom/prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    networks:
      - monitoring-network

volumes:
  db:
networks:
  monitoring-network:
    driver: bridge